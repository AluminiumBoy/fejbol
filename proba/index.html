<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fejből kisállat próba</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;800&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#1B1030;color:#F1F3F8;font-family:"Nunito",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;align-items:center;gap:10px}
  .name{font-family:"Anton",Impact,sans-serif;font-size:1.9rem;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.5);background:none;border:0;padding:0;color:inherit;cursor:pointer}
  .stats{margin-left:auto;display:flex;gap:6px}
  .pill{background:rgba(20,16,34,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:6px}
  .meter{width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:3px}
  .bubble{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;color:#1B1030;font-weight:800;font-size:1.05rem;padding:10px 18px;border-radius:20px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:82vw;text-align:center;transition:opacity .25s,transform .25s;pointer-events:none}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble.off{opacity:0;transform:translateX(-50%) translateY(6px)}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{flex:1;min-height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(28,20,48,.55);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);font-weight:800;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn img{width:26px;height:26px}
  .btn.on{background:#FF4D7A;border-color:#FF4D7A;color:#fff;box-shadow:0 0 30px -6px #FF4D7A}
  .btn.talk{flex:2;background:linear-gradient(135deg,#FFB547,#FF6A3D);color:#2A0F05;border:0;font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 8px 24px -8px rgba(255,106,61,.8)}
  .btn.talk.on{background:#FF4D7A;color:#fff}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .chip{border:1px solid rgba(255,255,255,.16);background:rgba(28,20,48,.55);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.82rem;color:#D9D2EA}
  .chip[aria-pressed="true"]{background:#fff;color:#1B1030}
  .credit{position:fixed;right:10px;bottom:2px;font-size:.58rem;opacity:.35;pointer-events:none}
  .pick{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;background:rgba(16,10,30,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pick[hidden]{display:none!important}
  .pick h2{margin:0;font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:2.3rem;text-transform:uppercase;letter-spacing:.03em}
  .pick .row{width:min(420px,100%)}
  .btn.big{flex-direction:column;min-height:120px;font-size:1.4rem;line-height:1.15}
  .btn.big small{font-weight:600;opacity:.7;font-size:.85rem}
  .btn.big .dot{width:22px;height:22px;border-radius:50%}
  .loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:800}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">Betöltés…</div>
<div class="hud">
  <button class="name" id="name">Rókus</button>
  <div class="stats">
    <span class="pill" title="Jóllakottság">Étel <span class="meter"><i id="mFood" style="width:60%;background:#FFB547"></i></span></span>
    <span class="pill" id="stage">Kölyök</span>
  </div>
</div>
<div class="bubble off" id="bubble"></div>
<div class="pick" id="pick" hidden>
  <h2>Kit nevelsz?</h2>
  <div class="row">
    <button class="btn big" data-g="m"><span class="dot" style="background:#3D8BFF"></span>Rókus<br><small>fiú róka</small></button>
    <button class="btn big" data-g="f"><span class="dot" style="background:#FF6FB5"></span>Roxi<br><small>lány róka</small></button>
  </div>
</div>
<div class="dock">
  <div class="chips" id="grow">
    <button class="chip" data-s="0" aria-pressed="true">Kölyök</button>
    <button class="chip" data-s="1">Kamasz</button>
    <button class="chip" data-s="2">Felnőtt</button>
    <button class="chip" data-s="3">Legenda</button>
  </div>
  <div class="row"><button class="btn talk" id="talk">Beszélj hozzá</button></div>
  <div class="row">
    <button class="btn" id="feed"><img src="drumstick.png" alt="">Etetés</button>
    <button class="btn" id="sleep"><img src="zzz.png" alt="">Alvás</button>
    <button class="btn" id="poem"><img src="sparkles.png" alt="">Vers</button>
  </div>
</div>
<div class="credit">Karakter: saját · ikonok: Microsoft Fluent (MIT) · hang: Microsoft neurális hang</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ================= színpad =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function gradTex(stops, w = 2, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, h);
  stops.forEach(([p, col]) => gr.addColorStop(p, col)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const dayBg = gradTex([[0, '#3A1F6B'], [.55, '#B4568C'], [1, '#F2A07B']]);
const nightBg = gradTex([[0, '#070714'], [.6, '#1C1640'], [1, '#2E2350']]);
scene.background = dayBg;

// háttér fényfoltok (bokeh)
function radialTex(col) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const bokeh = [];
for (let i = 0; i < 18; i++) {
  const col = ['rgba(255,200,140,.9)', 'rgba(255,140,190,.8)', 'rgba(170,150,255,.8)'][i % 3];
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex(col), transparent: true, depthWrite: false, opacity: .35 + Math.random() * .3 }));
  s.position.set((Math.random() - .5) * 9, 1 + Math.random() * 4, -4 - Math.random() * 3); s.scale.setScalar(.4 + Math.random() * 1.1);
  s.userData.ph = Math.random() * 6; scene.add(s); bokeh.push(s);
}

const hemi = new THREE.HemisphereLight(0xffe2cf, 0x3a2352, 1.0); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe7d0, 2.6); key.position.set(2.5, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.bias = -.0004;
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 3, bottom: -1.5 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xb7a4ff, .9); fill.position.set(-4, 2.5, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffc2e2, 1.8); rim.position.set(-1.5, 3, -4); scene.add(rim);

// padló: puha, kerek párna
const floorTex = radialTex('rgba(255,255,255,1)');
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 96), new THREE.MeshStandardMaterial({ color: 0x3E2358, roughness: .95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cushion = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.1, .16, 64), new THREE.MeshPhysicalMaterial({ color: 0x8E4FB8, roughness: .85, sheen: .6, sheenColor: 0xE0B0FF, sheenRoughness: .6 }));
cushion.position.y = .08; cushion.receiveShadow = true; cushion.castShadow = true; scene.add(cushion);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: floorTex, color: 0xffd6a8, transparent: true, opacity: .14, depthWrite: false }));
glow.position.set(0, 1.2, -1.2); glow.scale.set(5, 4, 1); scene.add(glow);

const camera = new THREE.PerspectiveCamera(32, 1, .05, 100);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), .22, .4, .97); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h;
  const portrait = w < h;
  camera.fov = portrait ? 40 : 30;
  camera.position.set(0, portrait ? 1.55 : 1.45, portrait ? 5.0 : 4.4);
  camera.lookAt(0, portrait ? 1.02 : 1.0, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ================= a karakter (saját, kódból épített rajzfilmróka) =================
const M = {
  fur: new THREE.MeshPhysicalMaterial({ color: 0xE85A12, roughness: .7, sheen: .45, sheenColor: 0xFFB070, sheenRoughness: .5 }),
  cream: new THREE.MeshPhysicalMaterial({ color: 0xF7EADB, roughness: .8, sheen: .4, sheenColor: 0xffffff, sheenRoughness: .6 }),
  dark: new THREE.MeshPhysicalMaterial({ color: 0x3A2419, roughness: .7, sheen: .6, sheenColor: 0x8a5a40 }),
  eye: new THREE.MeshPhysicalMaterial({ color: 0x1A0F0C, roughness: .08, clearcoat: 1, clearcoatRoughness: .05 }),
  iris: new THREE.MeshPhysicalMaterial({ color: 0x6B3A1E, roughness: .1, clearcoat: 1 }),
  shine: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  nose: new THREE.MeshPhysicalMaterial({ color: 0x241412, roughness: .15, clearcoat: 1 }),
  mouth: new THREE.MeshStandardMaterial({ color: 0x5A1420, roughness: .6 }),
  tongue: new THREE.MeshStandardMaterial({ color: 0xFF7A8A, roughness: .5 }),
  inner: new THREE.MeshPhysicalMaterial({ color: 0xFFD9D0, roughness: .8, sheen: 1, sheenColor: 0xffffff }),
  blush: new THREE.MeshBasicMaterial({ color: 0xFF7FA6, transparent: true, opacity: .0, depthWrite: false }),
  line: new THREE.MeshBasicMaterial({ color: 0x2A140E })
};
const sph = (r, mat, sx = 1, sy = 1, sz = 1, seg = 48) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * .66)), mat); m.scale.set(sx, sy, sz); m.castShadow = true; return m; };
const tube = (pts, r, mat) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, r, 10, false), mat);

const pet = new THREE.Group(); pet.position.y = .16; scene.add(pet);
const bodyG = new THREE.Group(); pet.add(bodyG);
// törzs (ülő, körte alak)
const body = sph(.5, M.fur, 1, 1.12, .95); body.position.set(0, .56, 0); bodyG.add(body);
const belly = sph(.36, M.cream, .92, 1.08, .55); belly.position.set(0, .5, .3); bodyG.add(belly);
// hátsó lábak
[-1, 1].forEach(s => { const h = sph(.26, M.fur, .95, .72, 1.25); h.position.set(s * .34, .2, .06); bodyG.add(h);
  const f = sph(.12, M.dark, 1.1, .6, 1.4); f.position.set(s * .36, .06, .34); bodyG.add(f); });
// mellső lábak
const paws = [];
[-1, 1].forEach(s => {
  const g = new THREE.Group(); g.position.set(s * .17, .52, .3);
  const leg = new THREE.Mesh(new THREE.CapsuleGeometry(.085, .34, 8, 24), M.fur); leg.position.y = -.22; leg.castShadow = true; g.add(leg);
  const toe = sph(.1, M.dark, 1, .75, 1.15); toe.position.set(0, -.44, .03); g.add(toe);
  bodyG.add(g); paws.push(g);
});
// farok: vastag, bolyhos ív, fehér véggel
const tailG = new THREE.Group(); tailG.position.set(.1, .3, -.38); bodyG.add(tailG);
const tailPts = []; for (let i = 0; i <= 8; i++) { const t = i / 8; tailPts.push(new THREE.Vector3(Math.sin(t * 2.2) * .5, t * .85, -Math.sin(t * 3.1) * .22)); }
tailPts.forEach((p, i) => {
  const t = i / 8, r = .1 + Math.sin(t * Math.PI * .9) * .2;
  const s = sph(r, i >= 7 ? M.cream : M.fur, 1, 1, 1, 32); s.position.copy(p); tailG.add(s);
});
// fej
const headG = new THREE.Group(); headG.position.set(0, 1.2, .02); pet.add(headG);
const skull = sph(.55, M.fur, 1.1, .94, .98); headG.add(skull);
[-1, 1].forEach(s => { const c = sph(.24, M.cream, 1.25, .82, .95); c.position.set(s * .37, -.2, .2); headG.add(c);
  const tuft = sph(.12, M.cream, 1.3, .7, .8); tuft.position.set(s * .56, -.24, .08); tuft.rotation.z = s * .5; headG.add(tuft); });
const muzzle = sph(.23, M.cream, 1.25, .78, 1.05); muzzle.position.set(0, -.2, .43); headG.add(muzzle);
const nose = sph(.075, M.nose, 1.25, .85, .9); nose.position.set(0, -.1, .66); headG.add(nose);
const noseShine = sph(.02, M.shine, 1, 1, 1, 12); noseShine.position.set(-.025, -.08, .72); headG.add(noseShine);
// száj: mosoly-vonal + nyitható száj
const smile = tube([new THREE.Vector3(-.1, -.26, .6), new THREE.Vector3(-.05, -.3, .63), new THREE.Vector3(0, -.27, .64), new THREE.Vector3(.05, -.3, .63), new THREE.Vector3(.1, -.26, .6)], .012, M.line); headG.add(smile);
const mouthOpen = new THREE.Group(); mouthOpen.position.set(0, -.3, .6); headG.add(mouthOpen);
const mo = sph(.075, M.mouth, 1.2, 1, .5, 32); mouthOpen.add(mo);
const tongue = sph(.05, M.tongue, 1.2, .6, .5, 24); tongue.position.set(0, -.035, .015); mouthOpen.add(tongue);
mouthOpen.scale.set(1, .01, 1);
// szemek
const eyes = [];
[-1, 1].forEach(s => {
  const g = new THREE.Group(); g.position.set(s * .21, .02, .47); g.rotation.y = s * .18;
  const e = sph(.125, M.eye, .82, 1.08, .55); g.add(e);
  const ir = sph(.07, M.iris, .85, 1, .3, 24); ir.position.set(0, -.03, .05); g.add(ir);
  const sh1 = sph(.036, M.shine, 1, 1, 1, 16); sh1.position.set(.04 * -s + .02, .05, .07); g.add(sh1);
  const sh2 = sph(.016, M.shine, 1, 1, 1, 12); sh2.position.set(-.03, -.05, .07); g.add(sh2);
  // boldog (^ ^) szem: ív, alapból rejtve
  const happy = tube([new THREE.Vector3(-.085, -.02, .07), new THREE.Vector3(0, .06, .08), new THREE.Vector3(.085, -.02, .07)], .018, M.line); happy.visible = false; g.add(happy);
  // szempilla (lánynál)
  const lashes = new THREE.Group(); lashes.visible = false;
  [0, 1, 2].forEach(k => { const l = tube([new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * .03, .03, 0), new THREE.Vector3(s * .06, .045, -.01)], .009, M.line);
    l.position.set(s * (.07 + k * .018), .11 - k * .03, .03); l.rotation.z = s * (-.2 - k * .35); lashes.add(l); });
  g.add(lashes);
  headG.add(g); eyes.push({ g, e, ir, sh1, sh2, happy, lashes });
});
// pirulás
const blushes = [-1, 1].map(s => { const b = new THREE.Mesh(new THREE.CircleGeometry(.07, 32), M.blush); b.position.set(s * .36, -.12, .5); b.rotation.y = s * .5; headG.add(b); return b; });
// fülek
function earGeo(h, r) {
  const pts = []; for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push(new THREE.Vector2(r * Math.pow(1 - t, .85) * (1 + .15 * Math.sin(t * Math.PI)), t * h)); }
  return new THREE.LatheGeometry(pts, 32);
}
const ears = [];
[-1, 1].forEach(s => {
  const g = new THREE.Group(); g.position.set(s * .33, .38, -.05); g.rotation.set(-.12, 0, s * -.38);
  const outer = new THREE.Mesh(earGeo(.5, .2), M.fur); outer.scale.z = .55; outer.castShadow = true; g.add(outer);
  const inner = new THREE.Mesh(earGeo(.4, .14), M.inner); inner.scale.z = .35; inner.position.set(0, .03, .05); g.add(inner);
  const tip = new THREE.Mesh(earGeo(.17, .082), M.dark); tip.scale.z = .6; tip.position.y = .33; g.add(tip);
  headG.add(g); ears.push(g);
});
// kiegészítők
// fiú: baseballsapka (hátrafelé fordított ellenzővel, lazán)
const capMat = new THREE.MeshPhysicalMaterial({ color: 0x2F6FE0, roughness: .55, sheen: .5, sheenColor: 0x9cc2ff, clearcoat: .2 });
const cap = new THREE.Group(); cap.position.set(0, .3, -.02); cap.rotation.x = -.18;
const dome = new THREE.Mesh(new THREE.SphereGeometry(.4, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), capMat); dome.scale.set(1.12, .72, 1.08); cap.add(dome);
const visor = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .035, 40, 1, false, Math.PI * .75, Math.PI * .5), capMat); visor.position.set(0, .01, -.08); visor.scale.set(1, 1, 1.25); cap.add(visor);
const button = sph(.04, new THREE.MeshPhysicalMaterial({ color: 0xFFFFFF, roughness: .4 }), 1, .6, 1, 16); button.position.y = .29; cap.add(button);
const stripe = new THREE.Mesh(new THREE.TorusGeometry(.445, .018, 10, 60), new THREE.MeshStandardMaterial({ color: 0xffffff })); stripe.rotation.x = Math.PI / 2; stripe.scale.set(1.0, .97, 1); stripe.position.y = .015; cap.add(stripe);
headG.add(cap);
const scarf = cap, scarfTail = cap;
const bow = new THREE.Group(); bow.position.set(.26, .5, .12); bow.rotation.z = -.3;
const bowMat = new THREE.MeshPhysicalMaterial({ color: 0xFF4F8B, roughness: .35, clearcoat: .6, sheen: 1, sheenColor: 0xffc0d8 });
[-1, 1].forEach(s => { const w = new THREE.Mesh(new THREE.ConeGeometry(.1, .17, 24), bowMat); w.rotation.z = s * Math.PI / 2; w.position.x = s * .09; w.scale.z = .5; bow.add(w); });
bow.add(sph(.045, bowMat, 1, 1, .8, 24)); headG.add(bow);
const glasses = new THREE.Group(); glasses.position.set(0, .03, .6); glasses.visible = false;
const gMat = new THREE.MeshPhysicalMaterial({ color: 0x0B0B12, roughness: .05, metalness: .3, clearcoat: 1 });
[-1, 1].forEach(s => { const l = new THREE.Mesh(new THREE.CapsuleGeometry(.075, .07, 8, 24), gMat); l.rotation.z = Math.PI / 2; l.scale.set(1, 1, .35); l.position.x = s * .2; glasses.add(l); });
const bridge = new THREE.Mesh(new THREE.BoxGeometry(.14, .02, .02), gMat); glasses.add(bridge); headG.add(glasses);
const crown = new THREE.Group(); crown.position.set(0, .5, -.02); crown.visible = false;
const gold = new THREE.MeshPhysicalMaterial({ color: 0xFFC53D, metalness: 1, roughness: .18, clearcoat: 1, emissive: 0x3a2400 });
const band = new THREE.Mesh(new THREE.CylinderGeometry(.24, .26, .11, 40, 1, true), gold); band.material.side = THREE.DoubleSide; crown.add(band);
for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const sp = new THREE.Mesh(new THREE.ConeGeometry(.045, .14, 16), gold); sp.position.set(Math.cos(a) * .24, .12, Math.sin(a) * .24); crown.add(sp);
  const gem = sph(.028, new THREE.MeshPhysicalMaterial({ color: [0xFF3D5A, 0x3D8BFF, 0x3DDC84][i % 3], roughness: .05, clearcoat: 1, emissive: [0x5a0010, 0x001a5a, 0x004a20][i % 3] }), 1, 1, 1, 16); gem.position.set(Math.cos(a) * .255, 0, Math.sin(a) * .255); crown.add(gem); }
headG.add(crown);

pet.traverse(o => { if (o.isMesh) o.castShadow = true; });

// ================= állapot, mozgás =================
const S = { stage: 0, grow: .7, growTo: .7, asleep: false, happyT: 0, jumpT: -1, eatT: -1, talk: 0, blinkT: 2, blink: 0, earT: 1.5, look: new THREE.Vector2(), lookTo: new THREE.Vector2(), food: .55 };
const STAGES = [['Kölyök', .68], ['Kamasz', .8], ['Felnőtt', .92], ['Legenda', 1.0]];
function setStage(s, quiet) {
  S.stage = s; S.growTo = STAGES[s][1];
  document.getElementById('stage').textContent = STAGES[s][0];
  document.querySelectorAll('#grow .chip').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === s));
  glasses.visible = s === 2; crown.visible = s >= 3;
  cap.visible = gender === 'm' && s < 3;
  if (!quiet) { jump(); sparkle(); say('Nézd, megnőttem!', 'grow'); }
}
document.querySelectorAll('#grow .chip').forEach(b => b.onclick = () => { audio(); setStage(+b.dataset.s); });

// csillámok (bloom miatt ragyognak)
const sparkles = [];
const sparkMat = new THREE.SpriteMaterial({ map: radialTex('rgba(255,240,200,1)'), color: 0xfff1c0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
function sparkle(n = 18, color = 0xfff1c0) {
  for (let i = 0; i < n; i++) {
    const s = new THREE.Sprite(sparkMat.clone()); s.material.color.set(color);
    const a = Math.random() * Math.PI * 2, r = .6 + Math.random() * .5;
    s.position.set(Math.cos(a) * r, .6 + Math.random() * 1.2, Math.sin(a) * r * .6 + .2); s.scale.setScalar(.08 + Math.random() * .1);
    scene.add(s); sparkles.push({ s, v: new THREE.Vector3((Math.random() - .5) * .3, .5 + Math.random() * .6, 0), life: 1.2 + Math.random() * .6 });
  }
}
const heartTex = new THREE.TextureLoader().load('red_heart.png'); heartTex.colorSpace = THREE.SRGBColorSpace;
function hearts(n = 4) {
  for (let i = 0; i < n; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTex, transparent: true, depthWrite: false }));
    s.position.set((Math.random() - .5) * .8, 1.5 + Math.random() * .3, .4); s.scale.setScalar(.16 + Math.random() * .08);
    scene.add(s); sparkles.push({ s, v: new THREE.Vector3((Math.random() - .5) * .4, .7 + Math.random() * .4, 0), life: 1.4 });
  }
}
function jump() { S.jumpT = 0; }
function happy(sec = 1.2) { S.happyT = sec; }

// ================= beszéd, hang =================
let gender = ''; try { gender = localStorage.getItem('fejbol.pet.g') || ''; } catch (e) {}
const NAMES = { m: 'Rókus', f: 'Roxi' };
function applyGender() {
  document.getElementById('name').textContent = NAMES[gender] || 'Róka';
  cap.visible = gender === 'm' && S.stage < 3;
  bow.visible = gender === 'f';
  eyes.forEach(e => e.lashes.visible = gender === 'f');
}
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
  audio(); gender = b.dataset.g; try { localStorage.setItem('fejbol.pet.g', gender); } catch (e) {}
  voiceCache.clear(); applyGender(); document.getElementById('pick').hidden = true;
  jump(); happy(); hearts(); say('Szia! Én vagyok ' + NAMES[gender] + '. Mondj valamit!', 'hello', 3200);
});
document.getElementById('name').onclick = () => document.getElementById('pick').hidden = false;

let ac, bubbleT, voiceSrc = null, speakAn = null;
function audio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
const voiceCache = new Map();
function voice(k) {
  if (!voiceCache.has(k)) voiceCache.set(k, fetch(`voice/${gender || 'm'}/${k}.mp3`).then(r => r.arrayBuffer()).then(b => audio().decodeAudioData(b)));
  return voiceCache.get(k);
}
function speakBuffer(buf, rate = 1) {
  const a = audio(); try { voiceSrc?.stop(); } catch (e) {}
  const src = a.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
  const an = a.createAnalyser(); an.fftSize = 1024; src.connect(an); an.connect(a.destination);
  speakAn = an; voiceSrc = src; src.start();
  return new Promise(res => src.onended = () => { if (voiceSrc === src) { speakAn = null; voiceSrc = null; } res(); });
}
function say(txt, k, ms = 2600) {
  const b = document.getElementById('bubble'); b.textContent = txt; b.classList.remove('off');
  clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.add('off'), ms);
  if (k && gender && ac) voice(k).then(buf => speakBuffer(buf)).catch(() => {});
}
function blip(f) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f, a.currentTime); o.frequency.exponentialRampToValueAtTime(f * 1.7, a.currentTime + .12);
  g.gain.setValueAtTime(.09, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .2);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .22);
}
const tbuf = new Float32Array(1024);
function level(an) { an.getFloatTimeDomainData(tbuf); let s = 0; for (const v of tbuf) s += v * v; return Math.sqrt(s / tbuf.length); }

// ================= érintés: megbökés, simogatás, követő tekintet =================
const LINES = [['Hihi, ez csiklandoz!', 'poke1'], ['Tanuljunk még egy versszakot?', 'poke2'], ['Éhes vagyok… egy feladat?', 'poke3'], ['Te vagy a legjobb!', 'poke4'], ['Mondd el nekem a verset!', 'poke5']];
canvas.addEventListener('pointermove', e => S.lookTo.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));
canvas.addEventListener('pointerdown', e => {
  audio(); S.lookTo.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (S.asleep) { say('Zzz… hagyj aludni…', 'sleepy'); return; }
  const [t, k] = LINES[Math.floor(Math.random() * LINES.length)];
  jump(); happy(); hearts(3); say(t, k); blip(760);
});

// ================= etetés =================
const foodTex = new THREE.TextureLoader().load('drumstick.png'); foodTex.colorSpace = THREE.SRGBColorSpace;
let food = null;
document.getElementById('feed').onclick = () => {
  audio(); if (food) return;
  if (S.asleep) return say('Majd reggel!', 'later');
  food = new THREE.Sprite(new THREE.SpriteMaterial({ map: foodTex, transparent: true, depthWrite: false })); food.scale.setScalar(.34);
  food.position.set(.2, 2.6, .8); scene.add(food); say('Nyami!', 'yum');
};

// ================= alvás =================
const zzzTex = new THREE.TextureLoader().load('zzz.png'); zzzTex.colorSpace = THREE.SRGBColorSpace;
const zzz = new THREE.Sprite(new THREE.SpriteMaterial({ map: zzzTex, transparent: true, depthWrite: false })); zzz.scale.setScalar(.35); zzz.visible = false; scene.add(zzz);
document.getElementById('sleep').onclick = e => {
  audio(); S.asleep = !S.asleep; e.currentTarget.classList.toggle('on', S.asleep);
  scene.background = S.asleep ? nightBg : dayBg;
  hemi.intensity = S.asleep ? .35 : 1; key.intensity = S.asleep ? .6 : 2.6; key.color.set(S.asleep ? 0x9fb4ff : 0xffe7d0);
  bokeh.forEach(b => b.material.opacity = S.asleep ? .15 : .45);
  zzz.visible = S.asleep;
  if (S.asleep) { if (listening) toggleTalk(); say('Jó éjt!', 'night'); }
  else { say('Jó reggelt! Tanulunk?', 'morning'); jump(); happy(); }
};

// ================= visszabeszélés (mint Talking Tom) =================
let listening = false, stream, micAn, recorder, chunks = [], speaking = false, quietSince = 0, replaying = false;
const talkBtn = document.getElementById('talk');
talkBtn.onclick = toggleTalk;
async function toggleTalk() {
  if (listening) { listening = false; talkBtn.classList.remove('on'); talkBtn.textContent = 'Beszélj hozzá'; stream?.getTracks().forEach(t => t.stop()); stream = null; return; }
  if (S.asleep) return say('Zzz… hagyj aludni…', 'sleepy');
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { say('Engedélyezd a mikrofont, hogy halljalak!', 'mic', 3000); return; }
  const a = audio(); micAn = a.createAnalyser(); micAn.fftSize = 1024; a.createMediaStreamSource(stream).connect(micAn);
  listening = true; talkBtn.classList.add('on'); talkBtn.textContent = 'Hallgatlak…';
  say('Mondj valamit, visszamondom!', 'listen', 2500);
}
function vad(now) {
  if (!listening || replaying || !micAn || speakAn) return;
  const l = level(micAn);
  if (!speaking && l > .035) {
    speaking = true; quietSince = 0; chunks = [];
    recorder = new MediaRecorder(stream); recorder.ondataavailable = e => chunks.push(e.data); recorder.onstop = replay; recorder.start();
  } else if (speaking) {
    if (l < .02) { quietSince ||= now; if (now - quietSince > 700) { speaking = false; recorder.stop(); } } else quietSince = 0;
  }
}
async function replay() {
  if (!chunks.length) return;
  replaying = true;
  try {
    const b = await audio().decodeAudioData(await new Blob(chunks, { type: recorder.mimeType }).arrayBuffer());
    await speakBuffer(b, 1.6);
  } catch (e) {}
  replaying = false;
}

// ================= versmondás =================
document.getElementById('poem').onclick = async () => {
  audio(); if (S.asleep) return say('Zzz… hagyj aludni…', 'sleepy');
  try {
    const idx = await (await fetch('../audio/index.json')).json();
    const [text, e] = Object.entries(idx.stanzas)[0];
    const v = gender === 'f' ? 'noemi' : 'tamas';
    const buf = await audio().decodeAudioData(await (await fetch(`../audio/${v}/${e.file}.mp3`)).arrayBuffer());
    say(text.split('\n')[0] + ' …', null, 4200); await speakBuffer(buf, 1.05);
  } catch (err) { say('Most nem megy a versmondás.'); }
};

// ================= fő ciklus =================
const clock = new THREE.Clock();
const headWorld = new THREE.Vector3();
function tick() {
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime, now = performance.now();
  vad(now);
  // növekedés
  S.grow += (S.growTo - S.grow) * Math.min(1, dt * 3);
  // lélegzés, ugrás (összenyomódással), beszéd
  const breath = Math.sin(t * (S.asleep ? 1.3 : 2.4)) * (S.asleep ? .025 : .015);
  let jy = 0, squash = 0;
  if (S.jumpT >= 0) {
    S.jumpT += dt; const p = S.jumpT / .75;
    if (p >= 1) S.jumpT = -1;
    else if (p < .18) squash = Math.sin(p / .18 * Math.PI) * .12;
    else { const q = (p - .18) / .82; jy = Math.sin(q * Math.PI) * .38; squash = -Math.sin(q * Math.PI) * .06; }
  }
  pet.position.y = .16 + jy;
  pet.scale.set(S.grow * (1 + squash * .6), S.grow * (1 - squash + breath), S.grow * (1 + squash * .6));
  if (speakAn) { S.talk += (Math.min(1, level(speakAn) * 7) - S.talk) * .45; } else S.talk *= .75;
  mouthOpen.scale.set(1 + S.talk * .2, .01 + S.talk * 1.1 + (S.eatT >= 0 ? Math.abs(Math.sin(S.eatT * 16)) * .6 : 0), 1);
  smile.visible = mouthOpen.scale.y < .15;
  // tekintet: a fej és a szemek az ujjat követik
  if (!S.asleep) S.look.lerp(S.lookTo, Math.min(1, dt * 4)); else S.look.lerp(new THREE.Vector2(0, -.6), dt * 2);
  headG.rotation.y = S.look.x * .35;
  headG.rotation.x = -S.look.y * .18 + (S.asleep ? .35 : 0) + Math.sin(t * 1.3) * .02 + S.talk * .05;
  headG.rotation.z = Math.sin(t * .9) * .04 + (S.asleep ? .15 : 0);
  headG.position.y = 1.2 + breath * 2;
  // pislogás
  S.blinkT -= dt; if (S.blinkT <= 0) { S.blink = .16; S.blinkT = 2 + Math.random() * 3.5; }
  S.blink = Math.max(0, S.blink - dt);
  const closed = S.asleep || S.happyT > 0 ? 1 : S.blink > 0 ? Math.sin(S.blink / .16 * Math.PI) : 0;
  eyes.forEach(e => {
    const shut = S.asleep || S.happyT > 0;
    e.e.visible = e.ir.visible = e.sh1.visible = e.sh2.visible = !shut;
    e.happy.visible = shut; e.happy.rotation.z = S.asleep ? Math.PI : 0; e.happy.position.y = S.asleep ? -.04 : 0;
    e.g.scale.y = shut ? 1 : 1 - closed * .92;
    e.ir.position.x = S.look.x * .02; e.ir.position.y = -.03 + S.look.y * .015;
  });
  S.happyT = Math.max(0, S.happyT - dt);
  M.blush.opacity += ((S.happyT > 0 ? .55 : .18) - M.blush.opacity) * Math.min(1, dt * 5);
  // fülek, farok, mancsok
  S.earT -= dt; let twitch = 0; if (S.earT <= 0) { S.earT = 2 + Math.random() * 4; } if (S.earT > 0 && S.earT < .25) twitch = Math.sin(S.earT / .25 * Math.PI) * .35;
  ears.forEach((g, i) => { const s = i ? 1 : -1; g.rotation.z = s * -.38 + (i ? twitch : 0) * s - (S.asleep ? s * .25 : 0); g.rotation.x = -.12 + (S.asleep ? .3 : 0); });
  tailG.rotation.y = Math.sin(t * (S.happyT > 0 ? 9 : 2.2)) * (S.happyT > 0 ? .5 : .25);
  tailG.rotation.z = Math.sin(t * 1.7) * .08;
  paws.forEach((g, i) => g.rotation.x = S.eatT >= 0 ? -.6 - Math.sin(S.eatT * 8 + i) * .1 : 0);
  // etetés
  headG.getWorldPosition(headWorld);
  if (food) {
    const target = headWorld.clone().add(new THREE.Vector3(0, -.3 * S.grow, .55 * S.grow));
    food.position.lerp(target, Math.min(1, dt * 3.2)); food.material.rotation += dt * 3;
    if (food.position.distanceTo(target) < .1) {
      scene.remove(food); food = null; S.eatT = 0; blip(520); setTimeout(() => blip(700), 120);
      S.food = Math.min(1, S.food + .2); document.getElementById('mFood').style.width = S.food * 100 + '%';
    }
  }
  if (S.eatT >= 0) { S.eatT += dt; if (S.eatT > 1.3) { S.eatT = -1; happy(1); hearts(5); say('Mmm, finom! Köszi!', 'thanks'); } }
  zzz.position.set(headWorld.x + .45 * S.grow, headWorld.y + .45 * S.grow + Math.sin(t * 1.5) * .06, headWorld.z); zzz.material.opacity = .6 + Math.sin(t * 2) * .3;
  crown.rotation.y = Math.sin(t * .8) * .1;
  // háttér
  bokeh.forEach(b => { b.position.y += Math.sin(t * .4 + b.userData.ph) * .0015; });
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const p = sparkles[i]; p.life -= dt; p.s.position.addScaledVector(p.v, dt); p.s.material.opacity = Math.min(1, p.life);
    if (p.life <= 0) { scene.remove(p.s); sparkles.splice(i, 1); }
  }
  composer.render();
  requestAnimationFrame(tick);
}

applyGender(); setStage(0, true);
document.getElementById('loading').remove();
if (!gender) document.getElementById('pick').hidden = false;
else say('Koppints rám, vagy mondj valamit!', null, 3000);
tick();
</script>
</body>
</html>
